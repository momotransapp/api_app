<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — MobileMoney Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0a0c10;
  --bg2:    #111318;
  --border: rgba(255,255,255,0.08);
  --text:   #e8eaf0;
  --text2:  #8a8fa0;
  --text3:  #555a6a;
  --accent: #2979FF;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* Grid background */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(41,121,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(41,121,255,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* Glow */
body::after {
  content: '';
  position: absolute;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(41,121,255,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.login-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  padding: 24px;
}

.login-logo {
  text-align: center;
  margin-bottom: 40px;
}

.logo-icon {
  width: 52px; height: 52px;
  background: var(--accent);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  margin: 0 auto 14px;
  box-shadow: 0 0 40px rgba(41,121,255,0.3);
}

.logo-name {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: var(--text);
}

.logo-desc {
  font-size: 13px;
  color: var(--text3);
  margin-top: 4px;
}

.login-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 32px;
}

.login-title {
  font-family: 'Syne', sans-serif;
  font-size: 19px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.login-sub {
  font-size: 13px;
  color: var(--text3);
  margin-bottom: 28px;
}

.field { margin-bottom: 16px; }

.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 7px;
  letter-spacing: 0.03em;
}

.field input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(41,121,255,0.12);
}

.field input::placeholder { color: var(--text3); }

.error-msg {
  display: flex; align-items: center; gap: 8px;
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  color: #f87171;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 20px;
}

.submit-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 20px rgba(41,121,255,0.25);
}

.submit-btn:hover {
  background: #1a56d4;
  box-shadow: 0 4px 28px rgba(41,121,255,0.4);
  transform: translateY(-1px);
}

.submit-btn:active { transform: translateY(0); }

.admin-note {
  text-align: center;
  margin-top: 20px;
  font-size: 11.5px;
  color: var(--text3);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-icon">💱</div>
    <div class="logo-name">MobileMoney</div>
    <div class="logo-desc">Panneau d'administration</div>
  </div>

  <div class="login-card">
    <div class="login-title">Connexion</div>
    <div class="login-sub">Accès réservé aux administrateurs</div>

    {% if error %}
    <div class="error-msg">
      <span>⚠</span> {{ error }}
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>Adresse email</label>
        <input type="email" name="email" placeholder="admin@exemple.com"
               value="{{ request.POST.email }}" autofocus required>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" name="password" placeholder="••••••••••" required>
      </div>
      <button type="submit" class="submit-btn">Se connecter →</button>
    </form>
  </div>

  <div class="admin-note">
    🔒 Accès sécurisé — Personnel autorisé uniquement
  </div>
</div>

</body>
</html>
